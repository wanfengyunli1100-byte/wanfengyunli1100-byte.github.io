<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="DeskPet 系统框图：电源链失败点、主控外设、已验证的软件">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4a4a"/>
    </marker>
  </defs>
  <style>
    text { font-family: ui-monospace, Consolas, "PingFang SC", "Microsoft YaHei", monospace; }
    .fig { font-size: 12px; fill: #8c8c8c; letter-spacing: .08em; }
    .cap { font-size: 13.5px; fill: #1a1a1a; }
    .sub { font-size: 11.5px; fill: #4a4a4a; }
    .note { font-size: 12px; fill: #c2410c; letter-spacing: .03em; }
    .box { fill: #ffffff; stroke: #4a4a4a; stroke-width: 1.4; }
    .cell { fill: #f4f2ec; stroke: #c8c1b2; stroke-width: 1; }
    .ln { stroke: #4a4a4a; stroke-width: 1.4; fill: none; marker-end: url(#a); }
    .fail { fill: #fff8f5; stroke: #c2410c; stroke-width: 1.4; stroke-dasharray: 5 4; }
  </style>

  <text class="fig" x="24" y="30">FIG. 01 / DESKPET · 系统框图与失败点</text>

  <!-- 电源链（失败区） -->
  <rect class="fail" x="60" y="52" width="840" height="132"/>
  <text class="cap" x="80" y="78">电源链 · 失败点</text>
  <rect class="cell" x="90" y="92" width="160" height="46"/>
  <text class="sub" x="112" y="120">Type-C 供电</text>
  <line class="ln" x1="252" y1="115" x2="292" y2="115"/>
  <rect class="cell" x="294" y="92" width="170" height="46"/>
  <text class="sub" x="316" y="120">TP4056 充电管理</text>
  <line class="ln" x1="466" y1="115" x2="506" y2="115"/>
  <rect class="cell" x="508" y="92" width="150" height="46"/>
  <text class="sub" x="530" y="120">1000mAh 电池</text>
  <line class="ln" x1="660" y1="115" x2="700" y2="115"/>
  <rect class="cell" x="702" y="92" width="170" height="46"/>
  <text class="sub" x="724" y="120">MT3608 升压 3V3</text>
  <text class="note" x="80" y="166">上电即失败：① 开关未串总回路（断开仍供电）　② 蜂鸣器长鸣　③ 过流烧焦味</text>

  <!-- 主控与外设 -->
  <rect class="box" x="60" y="208" width="840" height="222"/>
  <text class="cap" x="80" y="234">主控与外设</text>
  <rect class="box" x="90" y="250" width="290" height="162"/>
  <text class="cap" x="112" y="284">STM32F103C8T6</text>
  <text class="sub" x="112" y="310">@8MHz HSI · 裸机 C</text>
  <text class="sub" x="112" y="334">SWD 烧录（ST-Link）</text>
  <text class="sub" x="112" y="358">Flash 64KB / RAM 20KB</text>
  <text class="sub" x="112" y="382">10ms 主循环 · 中断驱动</text>
  <line class="ln" x1="382" y1="331" x2="424" y2="331"/>

  <rect class="cell" x="426" y="250" width="210" height="46"/>
  <text class="sub" x="448" y="270">SH1106 OLED 1.3"</text>
  <text class="sub" x="448" y="288">128×64 · 软件 SPI</text>
  <rect class="cell" x="656" y="250" width="212" height="46"/>
  <text class="sub" x="678" y="270">DHT11 温湿度</text>
  <text class="sub" x="678" y="288">超时 + 校验错误码</text>

  <rect class="cell" x="426" y="308" width="210" height="46"/>
  <text class="sub" x="448" y="328">DS3231 实时时钟</text>
  <text class="sub" x="448" y="346">I2C1 · 失败重置总线</text>
  <rect class="cell" x="656" y="308" width="212" height="46"/>
  <text class="sub" x="678" y="328">TTP223 触摸 ×2</text>
  <text class="sub" x="678" y="346">EXTI 唤醒 · 30ms 防抖</text>

  <rect class="cell" x="426" y="366" width="210" height="46"/>
  <text class="sub" x="448" y="386">有源蜂鸣器 PA0</text>
  <text class="sub" x="448" y="404">情绪反馈音</text>
  <rect class="cell" x="656" y="366" width="212" height="46"/>
  <text class="sub" x="678" y="386">外设容错</text>
  <text class="sub" x="678" y="404">降级显示 ERR:x / --:--</text>

  <!-- 软件（已验证） -->
  <rect class="box" x="60" y="448" width="840" height="118"/>
  <text class="cap" x="80" y="474">软件 · 已烧录验证</text>
  <rect class="cell" x="90" y="486" width="188" height="52"/>
  <text class="sub" x="110" y="508">分层架构</text>
  <text class="sub" x="110" y="526">App / Middleware / BSP</text>
  <rect class="cell" x="296" y="486" width="188" height="52"/>
  <text class="sub" x="316" y="508">mood 状态机</text>
  <text class="sub" x="316" y="526">-3 ~ 10 · 0 = 休眠</text>
  <rect class="cell" x="502" y="486" width="188" height="52"/>
  <text class="sub" x="522" y="508">STOP 深度睡眠</text>
  <text class="sub" x="522" y="526">EXTI 唤醒 · 50~150μA</text>
  <rect class="cell" x="708" y="486" width="160" height="52"/>
  <text class="sub" x="728" y="508">量产自检</text>
  <text class="sub" x="728" y="526">PASS / FAIL</text>

  <text class="sub" x="80" y="588">固件多次烧录验证通过 · 情绪系统为纯 C 逻辑，PC 端单元测试 ALL TESTS PASSED</text>
</svg>
