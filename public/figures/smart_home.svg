<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="分布式智能家居语音控制 系统框图">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4a4a"/>
    </marker>
  </defs>
  <style>
    text { font-family: ui-monospace, Consolas, "PingFang SC", "Microsoft YaHei", monospace; }
    .fig { font-size: 12px; fill: #8c8c8c; letter-spacing: .08em; }
    .cap { font-size: 13.5px; fill: #1a1a1a; }
    .sub { font-size: 11.5px; fill: #4a4a4a; }
    .note { font-size: 12px; fill: #c2410c; letter-spacing: .04em; }
    .box { fill: #ffffff; stroke: #4a4a4a; stroke-width: 1.4; }
    .cell { fill: #f4f2ec; stroke: #c8c1b2; stroke-width: 1; }
    .ln { stroke: #4a4a4a; stroke-width: 1.4; fill: none; marker-end: url(#a2); }
    .lb { font-size: 11px; fill: #8c8c8c; }
  </style>

  <text class="fig" x="24" y="30">FIG. 02 / 分布式智能家居语音控制 · 系统结构</text>

  <!-- 感知执行层 -->
  <rect class="box" x="60" y="70" width="300" height="380"/>
  <text class="cap" x="80" y="100">感知执行层</text>
  <rect class="cell" x="80" y="118" width="260" height="84"/>
  <text class="sub" x="100" y="152">STM32 #1</text>
  <text class="lb" x="100" y="176">温湿度采集 · 蓝牙上报</text>
  <rect class="cell" x="80" y="222" width="260" height="84"/>
  <text class="sub" x="100" y="256">STM32 #2</text>
  <text class="lb" x="100" y="280">状态显示 · 屏幕刷新</text>
  <rect class="cell" x="80" y="326" width="260" height="84"/>
  <text class="sub" x="100" y="360">STM32 #3</text>
  <text class="lb" x="100" y="384">电机控制 · 风扇启停</text>

  <!-- 连线：感知层 ↔ 上位机 -->
  <line class="ln" x1="360" y1="260" x2="436" y2="260"/>
  <line class="ln" x1="436" y1="290" x2="360" y2="290"/>
  <text class="lb" x="368" y="248">蓝牙</text>

  <!-- Qt 上位机 -->
  <rect class="box" x="440" y="170" width="180" height="180"/>
  <text class="cap" x="460" y="200">Qt 上位机</text>
  <text class="lb" x="460" y="226">多线程架构</text>
  <rect class="cell" x="460" y="244" width="140" height="42"/>
  <text class="lb" x="476" y="270">蓝牙收发</text>
  <rect class="cell" x="460" y="294" width="140" height="42"/>
  <text class="lb" x="476" y="320">推理调度</text>

  <!-- 连线：上位机 ↔ 大模型 -->
  <line class="ln" x1="620" y1="260" x2="696" y2="260"/>
  <line class="ln" x1="696" y1="290" x2="620" y2="290"/>

  <!-- 本地大模型 -->
  <rect class="box" x="700" y="170" width="200" height="180"/>
  <text class="cap" x="720" y="200">本地大模型</text>
  <text class="lb" x="720" y="226">双能力</text>
  <rect class="cell" x="720" y="244" width="160" height="42"/>
  <text class="lb" x="736" y="270">闲聊对话</text>
  <rect class="cell" x="720" y="294" width="160" height="42"/>
  <text class="lb" x="736" y="320">环境控制判断</text>

  <text class="note" x="60" y="500">闭环：采集 → 蓝牙传输 → Qt 解析 → 模型推理 → 指令回传 → 电机动作</text>
  <text class="sub" x="60" y="528">三块 STM32 分布式组网，采集 / 显示 / 控制各司其职</text>
</svg>
