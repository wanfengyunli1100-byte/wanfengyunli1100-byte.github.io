<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="Chatty-Bot 三层架构框图">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4a4a"/>
    </marker>
  </defs>
  <style>
    text { font-family: ui-monospace, Consolas, "PingFang SC", "Microsoft YaHei", monospace; }
    .fig { font-size: 12px; fill: #8c8c8c; letter-spacing: .08em; }
    .cap { font-size: 13.5px; fill: #1a1a1a; }
    .sub { font-size: 11.5px; fill: #4a4a4a; }
    .note { font-size: 12px; fill: #c2410c; letter-spacing: .04em; }
    .box { fill: #ffffff; stroke: #4a4a4a; stroke-width: 1.4; }
    .cell { fill: #f4f2ec; stroke: #c8c1b2; stroke-width: 1; }
    .ln { stroke: #4a4a4a; stroke-width: 1.4; fill: none; marker-end: url(#a); }
  </style>

  <text class="fig" x="24" y="30">FIG. 01 / CHATTY-BOT · 三层架构</text>

  <!-- 层 1：桌面端 -->
  <rect class="box" x="60" y="60" width="840" height="110"/>
  <text class="cap" x="80" y="88">PyQt6 桌面端 · 多线程</text>
  <rect class="cell" x="90" y="104" width="240" height="46"/>
  <text class="sub" x="112" y="132">聊天对话</text>
  <rect class="cell" x="360" y="104" width="240" height="46"/>
  <text class="sub" x="382" y="132">待办任务卡片</text>
  <rect class="cell" x="630" y="104" width="240" height="46"/>
  <text class="sub" x="652" y="132">历史持久化</text>

  <line class="ln" x1="480" y1="174" x2="480" y2="202"/>

  <!-- 层 2：Agent 编排 -->
  <rect class="box" x="60" y="206" width="840" height="124"/>
  <text class="cap" x="80" y="234">n8n Agent 编排 · 12 个核心节点</text>
  <rect class="cell" x="90" y="250" width="180" height="48"/>
  <text class="sub" x="112" y="279">Webhook</text>
  <rect class="cell" x="290" y="250" width="180" height="48"/>
  <text class="sub" x="306" y="279">意图分类·槽位提取</text>
  <rect class="cell" x="490" y="250" width="180" height="48"/>
  <text class="sub" x="512" y="279">Switch 分流</text>
  <rect class="cell" x="690" y="250" width="180" height="48"/>
  <text class="sub" x="712" y="279">HTTP 外部 API</text>

  <line class="ln" x1="480" y1="334" x2="480" y2="372"/>

  <!-- 层 3：模型 -->
  <rect class="box" x="60" y="376" width="840" height="112"/>
  <text class="cap" x="80" y="404">本地推理 · Ollama</text>
  <rect class="cell" x="80" y="420" width="380" height="50"/>
  <text class="sub" x="102" y="450">Qwen2.5-3B-Instruct · QLoRA 4bit</text>
  <rect class="cell" x="500" y="420" width="380" height="50"/>
  <text class="sub" x="522" y="450">LoRA 适配器 · 240MB</text>

  <text class="note" x="80" y="540">实测：4GB 消费级显卡跑通，量化后显存占用约 2.5GB</text>
  <text class="sub" x="80" y="566">微调：284 条指令数据，loss 3.6 → 2.19</text>
</svg>
