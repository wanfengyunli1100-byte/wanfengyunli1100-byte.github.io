# 影子部署：把站点发布到 GitHub Pages 预览地址，用于验证「构建 → 部署 → 访问」全链路。
# 明确不动正式域名 wanfengyunli.top（切域名是 M5 的事）。
#
# 为什么不需要 base 配置：站点仓库名是 <user>.github.io（GitHub 用户主站仓库），
# 预览地址就是根路径 https://wanfengyunli1100-byte.github.io/ —— 与站内硬编码的
# 绝对路径（/projects/、/figures/*.svg、/og.png、/favicon.svg）天然吻合。
# 若改用其它仓库名，站点会落在 /<repo>/ 子路径，需把所有绝对路径改成
# import.meta.env.BASE_URL 前缀（约 8-10 处）——这是选择主站仓库名的直接原因。
#
# 部署前置（一次性）：仓库 Settings → Pages → Source 选 "GitHub Actions"。
# 也可用 CLI 完成：gh api -X POST repos/<owner>/<repo>/pages -f build_type=workflow

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 官方 Astro Action：装依赖（自动探测 package-lock.json → npm）→ 构建 → 上传 Pages artifact
      # cache 默认 true：会缓存 Astro 构建缓存（将来接入图片管线后，这里能省下图片优化时间）
      - name: Build and upload site
        uses: withastro/action@v3
        with:
          node-version: 22
          out-dir: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
