# 生产部署：构建并通过 GitHub Actions 发布到 GitHub Pages。
# 站点已认领自定义域名 wanfengyunli.top（2026-09-27 上线）。
#
# 为什么不需要 base 配置：站点仓库名是 <user>.github.io（GitHub 用户主站仓库），
# 预览地址就是根路径 https://wanfengyunli1100-byte.github.io/ —— 与站内硬编码的
# 绝对路径（/projects/、/figures/*.svg、/og.png、/favicon.svg）天然吻合。
# 若改用其它仓库名，站点会落在 /<repo>/ 子路径，需把所有绝对路径改成
# import.meta.env.BASE_URL 前缀（约 8-10 处）——这是选择主站仓库名的直接原因。
#
# 正式上线（2026-09-27）：站点已认领自定义域名 wanfengyunli.top。
# 影子期的 PUBLIC_NOINDEX 注入已移除 —— 正式站必须允许搜索引擎收录。
#
# 部署前置（一次性）：仓库 Settings → Pages → Source 选 "GitHub Actions"，
# 并在 Pages 里填 Custom domain = wanfengyunli.top（证书签发后再勾 Enforce HTTPS）。
# 也可用 CLI：gh api -X POST repos/<owner>/<repo>/pages -f build_type=workflow
#            gh api -X PUT  repos/<owner>/<repo>/pages -f cname=wanfengyunli.top

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 官方 Astro Action：装依赖（自动探测 package-lock.json → npm）→ 构建 → 上传 Pages artifact
      # cache 会保留 Astro 构建缓存（将来接入图片管线后，这里能省下图片优化时间）
      - name: Build and upload site
        uses: withastro/action@v6
        with:
          node-version: 24       # 与本地开发环境一致
          out-dir: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
